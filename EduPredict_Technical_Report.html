## 1. Executive Summary

**EduPredict** is a full-stack, AI-powered student performance prediction system that combines **machine learning classification**, a **RESTful API**, a **modern React dashboard**, and a **RAG-powered AI chatbot**. The system ingests student academic and behavioral data, runs it through a trained ML model, and presents rich, animated prediction results with confidence scores, feature importance analysis, and actionable AI-generated advice.

| Dimension | Details |
|-----------|---------|
| **Problem** | Predict student academic performance tier (Poor / Average / Good) from 7 features |
| **Approach** | Supervised classification using ensemble tree models |
| **Dataset** | UCI Student Performance (Mathematics), 395 records, 33 original attributes |
| **Languages** | Python (ML + API), JavaScript/JSX (Frontend), CSS, HTML |
| **Total Components** | 14 standalone + 7 UI primitives + 8 page components = **29 React components** |
| **Total Pages** | 9 (Login, Dashboard, Analytics, Students, History, Performance, Insights, Settings, Help) |

## 4. Machine Learning Pipeline & Algorithms

### 4.1 Dataset

| Property | Details |
|----------|---------|
| **Source** | UCI Machine Learning Repository — Student Performance (Mathematics) |
| **File** | \`student-mat.csv\` (semicolon-delimited) |
| **Records** | 395 students |
| **Original Columns** | 33 (school, sex, age, address, famsize, Pstatus, Medu, Fedu, Mjob, Fjob, reason, guardian, traveltime, studytime, failures, schoolsup, famsup, paid, activities, nursery, higher, internet, romantic, famrel, freetime, goout, Dalc, Walc, health, absences, G1, G2, G3) |
| **Target Variable** | \`G3\` (final grade, 0–20 scale) |

### 4.2 Feature Engineering

7 features are extracted/engineered from the raw dataset:

| Feature | Formula / Source | Type | Range |
|---------|-----------------|------|-------|
| \`attendance\` | \`100 - absences\` | Numeric (engineered) | 25–100 |
| \`internal_avg\` | \`(G1 + G2) / 2\` | Numeric (engineered) | 0–20 |
| \`studytime\` | Raw column | Numeric (ordinal) | 1–4 |
| \`backlogs\` | \`failures\` (renamed) | Numeric | 0–4 |
| \`schoolsup\` | Raw column → LabelEncoder | Binary (0/1) | {0, 1} |
| \`activities\` | Raw column → LabelEncoder | Binary (0/1) | {0, 1} |
| \`higher\` | Raw column → LabelEncoder | Binary (0/1) | {0, 1} |

### 4.3 Target Encoding (3-Class Classification)

\`\`\`python
def grade_to_label(g):
    if g < 10:  return 0   # Poor Performance
    elif g < 14: return 1  # Average Performance
    else:        return 2  # Good Performance
\`\`\`

### 4.4 Preprocessing Pipeline

\`\`\`
Raw CSV
  → Feature Engineering (attendance, internal_avg, backlogs)
  → Label Encoding (schoolsup, activities, higher → 0/1)
  → train_test_split (80/20, stratified, random_state=42)
  → StandardScaler (fit on train, transform both)
  → Model Training
\`\`\`

### 4.5 Algorithms

#### Algorithm 1: Random Forest Classifier

| Parameter | Base Model | Tuned Model (GridSearchCV) |
|-----------|-----------|---------------------------|
| \`n_estimators\` | 300 | Grid: {200, 300, 400} |
| \`max_depth\` | 12 | Grid: {8, 12, 16} |
| \`min_samples_split\` | default (2) | Grid: {2, 5} |
| \`min_samples_leaf\` | default (1) | Grid: {1, 2} |
| \`random_state\` | 42 | 42 |

**How it works:**  
Random Forest builds an ensemble of \`n_estimators\` decision trees, each trained on a bootstrap sample of the training data with a random subset of features. Final prediction = majority vote of all trees. Feature importance = mean decrease in impurity (Gini) across all trees.

#### Algorithm 2: XGBoost Classifier

| Parameter | Base Model | Tuned Model (GridSearchCV) |
|-----------|-----------|---------------------------|
| \`n_estimators\` | 300 | Grid: {200, 300} |
| \`learning_rate\` | 0.05 | Grid: {0.03, 0.05} |
| \`max_depth\` | 6 | Grid: {4, 6} |
| \`subsample\` | default (1.0) | Grid: {0.8, 1.0} |
| \`colsample_bytree\` | default (1.0) | Grid: {0.8, 1.0} |
| \`objective\` | \`multi:softprob\` | \`multi:softprob\` |
| \`num_class\` | 3 | 3 |
| \`eval_metric\` | \`mlogloss\` | \`mlogloss\` |

**How it works:**  
XGBoost (eXtreme Gradient Boosting) builds trees sequentially, where each new tree corrects the errors of the previous ensemble. Uses \`multi:softprob\` for multi-class probability output. Regularization via \`learning_rate\`, \`subsample\`, and \`colsample_bytree\`.

### 4.6 Model Selection & Evaluation

| Script | Method | Scoring | Selection Criteria |
|--------|--------|---------|--------------------|
| \`student_performance_model.py\` | Direct fit + 5-fold CV | Accuracy, F1 (weighted), CV score | Best F1 score |
| \`student_performance_tuned_model.py\` | \`GridSearchCV\` (5-fold CV) | \`f1_weighted\` | Best F1 score across all grid combinations |

**Champion model** is saved as \`final_student_model.pkl\` along with \`scaler.pkl\`. Reports indicate Random Forest or XGBoost wins depending on the data split, but both achieve comparable performance on this dataset.

### 4.7 Model Outputs Used in Production

| Output | Source | Used In |
|--------|--------|---------|
| **Predicted Class** (0, 1, 2) | \`model.predict()\` | Label mapping → Performance tier name |
| **Confidence Score** | \`max(model.predict_proba())\` | Percentage display in UI |
| **Feature Importances** (7 values) | \`model.feature_importances_\` | Bar chart in ResultDisplay |

#### \`POST /predict\`
**Core Prediction Endpoint**

**Request Body (JSON):**
\`\`\`json
{
  "attendance": 85,
  "internal_avg": 14.5,
  "studytime": 3,
  "backlogs": 0,
  "schoolsup": 0,
  "activities": 1,
  "higher": 1
}
\`\`\`

**Response Body (JSON):**
\`\`\`json
{
  "prediction": 2,
  "performance": "Good Performance",
  "confidence": 0.87,
  "feature_importance": {
    "attendance": 0.12,
    "internal_avg": 0.45,
    "studytime": 0.08,
    "backlogs": 0.15,
    "schoolsup": 0.03,
    "activities": 0.05,
    "higher": 0.12
  }
}
\`\`\`

**Error Response:**
\`\`\`json
{
  "error": "Error description string"
}
\`\`\`

### 5.3 API Processing Pipeline

\`\`\`
1. Receive JSON body via request.get_json()
2. Extract 7 features in exact order → NumPy array (1, 7)
3. scaler.transform() → normalized features
4. model.predict() → class label (0/1/2)
5. model.predict_proba() → probability array → max = confidence
6. model.feature_importances_ → dict of {feature_name: weight}
7. Return JSON with prediction, performance label, confidence, feature_importance
\`\`\`

### 5.4 Model Loading

Both \`final_student_model.pkl\` and \`scaler.pkl\` are loaded **at server startup** (global scope), not per-request. This ensures:
- Zero cold-load latency on prediction requests
- Consistent model state across all requests

## 7. AI Chatbot Integration

### 7.1 Architecture

| Aspect | Details |
|--------|---------|
| **Provider** | Groq Cloud (https://api.groq.com) |
| **Model** | \`llama-3.3-70b-versatile\` |
| **API Format** | OpenAI-compatible (\`/openai/v1/chat/completions\`) |
| **Authentication** | Bearer token via \`VITE_GROQ_API_KEY\` (from \`.env.local\`) |
| **Temperature** | 0.7 |
| **Technique** | Retrieval-Augmented Generation (RAG) |

### 7.2 RAG Implementation

The chatbot implements a lightweight RAG pattern:

1. **Retrieval:** On each message, reads \`studentDirectoryData\` from \`localStorage\`
2. **Augmentation:** Extracts top 5 students with name, branch, CGPA, and skills
3. **Generation:** Injects retrieved data into the system prompt as context, then sends full conversation history to Groq

**System Prompt Structure:**
\`\`\`
Role: EduPredict AI — career advisor & recruitment assistant
Pillars: CGPA, Internships, Projects, Certifications
Context: [Top 5 students from directory with profiles]
Total students in database: [count]

## 8. Database / Data Layer

> [!IMPORTANT]
> This project does **not** use a traditional database (SQL/NoSQL). All persistence is handled through **flat files** (CSV, PKL) and **browser localStorage**.

### 8.1 Data Storage Map

| Data | Storage | Format | Persistence |
|------|---------|--------|-------------|
| **Training Dataset** | \`student-mat.csv\` | CSV (semicolon-delimited), 395 rows × 33 cols | File system (static) |
| **Trained ML Model** | \`final_student_model.pkl\` | Joblib-serialized scikit-learn model (~3.3 MB) | File system (generated by training script) |
| **Feature Scaler** | \`scaler.pkl\` | Joblib-serialized StandardScaler (~1 KB) | File system (generated by training script) |
| **Prediction History** | \`localStorage['predictionHistory']\` | JSON array (max 20 entries) | Browser (per-device) |
| **Student Directory** | \`localStorage['studentDirectoryData']\` | JSON array (350+ procedurally generated profiles) | Browser (per-device) |
| **Bookmarked Students** | \`localStorage['bookmarkedStudents']\` | JSON array of student IDs | Browser (per-device) |
| **Custom Profiles** | \`localStorage['customStudentProfiles']\` | JSON array of user-created profiles | Browser (per-device) |
| **Groq API Key** | \`.env.local\` (\`VITE_GROQ_API_KEY\`) | Plain text environment variable | File system (not committed) |

### 8.2 UCI Dataset Schema

The \`student-mat.csv\` file contains **33 columns** across 395 student records:

| Category | Columns |
|----------|---------|
| **School** | school (GP/MS) |
| **Demographics** | sex, age, address (U/R), famsize, Pstatus |
| **Family** | Medu, Fedu (education level 0-4), Mjob, Fjob, guardian |
| **Academic** | reason, traveltime, studytime, failures, schoolsup, famsup, paid, activities, nursery, higher, internet, romantic |
| **Lifestyle** | famrel, freetime, goout, Dalc (workday alcohol), Walc (weekend alcohol), health, absences |
| **Grades** | G1 (period 1), G2 (period 2), **G3** (final grade — **target**) |

### 8.3 Student Directory Data Model

Each procedurally generated student profile (from \`StudentsDirectoryPage.jsx\`) contains:

\`\`\`typescript
interface Student {
  id: string;             // Unique ID (e.g., "CSE-001")
  name: string;           // Realistic Indian name
  enrollment: string;     // Enrollment number
  branch: string;         // CSE | IT | EXTC | Mechanical | Civil
  cgpa: number;           // 6.0–10.0 (weighted distribution)
  email: string;          // name@college.edu
  skills: string[];       // Branch-specific skill set
  certifications: string[]; // Branch-specific certifications
  attendance: number;     // 60–100%
  projects: number;       // 1–8
  internships: number;    // 0–4
  semester: number;       // 3–8
}
\`\`\`

**Distribution:** 70 students per branch × 5 branches = 350 base profiles. CGPA distribution: 80% between 6.0–8.5, 20% between 8.5–10.0.

### 12.3 Key Design Decisions

| Decision | Rationale |
|----------|-----------|
| **No traditional database** | 395-record dataset fits in memory; prediction history is user-local; student directory is procedurally generated |
| **localStorage for persistence** | Zero infrastructure cost; data stays on user's device; sufficient for demo/academic purposes |
| **Flask over Django/FastAPI** | Minimal API surface (2 routes); Flask's simplicity matches the use case |
| **Client-side routing (no react-router)** | Simple \`switch\` statement with \`activePage\` state; 9 pages don't warrant a routing library |
| **Groq over OpenAI** | Free tier with high-speed inference; LLaMA 3.3 70B is comparable quality for advisory tasks |
| **RAG via localStorage** | Avoids vector DB complexity; student directory is small enough to inject directly into prompts |
| **GridSearchCV for tuning** | Exhaustive search over defined parameter grids; 5-fold CV with \`f1_weighted\` scoring ensures robust model selection |
| **Both RF and XGBoost** | Ensemble diversity; champion model selected automatically based on F1 score |
